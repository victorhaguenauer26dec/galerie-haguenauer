name: Publier la galerie sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Préparer les fichiers du site
        shell: pwsh
        run: ./scripts/prepare-site.ps1
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Charger le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
